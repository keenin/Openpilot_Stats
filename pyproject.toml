[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "op-usage"
version = "0.1.0"
description = "Personal openpilot usage site: engaged-time stats per flashed commit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "pycapnp>=2.0.0",
  "zstandard>=0.22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
op-usage = "op_usage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
op_usage = ["schemas/*.capnp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
